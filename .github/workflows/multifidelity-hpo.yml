name: Multi-fidelity HPO checks

on:
  push:
    branches:
      - feature/multifidelity-hpo
  pull_request:

jobs:
  test-multifidelity:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pytest numpy pandas scikit-learn optuna
      - name: Syntax check touched Python files
        run: |
          python -m py_compile \
            scripts/hp_search.py \
            scripts/run_independent_optuna_all_datasets.py \
            src/multifidelity_hpo.py \
            src/learning_curve_surrogate.py
      - name: Run multi-fidelity unit tests
        run: |
          pytest -q \
            tests/test_multifidelity_hpo.py \
            tests/test_learning_curve_surrogate.py \
            tests/test_hp_search_multifidelity_hook.py \
            tests/test_run_independent_optuna_all_datasets.py
